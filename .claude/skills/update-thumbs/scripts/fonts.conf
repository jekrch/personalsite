<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Used by capture.mjs under WSL. Many project sites use the OS font stack
     (system-ui, "Segoe UI", Verdana…) and load no webfonts; plain Linux has none of
     those, so text falls back to DejaVu Sans. This adds the Windows fonts and makes
     Segoe UI the default sans so screenshots match what a Windows visitor sees. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/mnt/c/Windows/Fonts</dir>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Segoe UI</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Segoe UI</family></prefer>
  </alias>
</fontconfig>
